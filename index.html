<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Game</title>
</head>
<body>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
        }

        body {
            display: grid;
            height: 100dvh;
            grid-template-columns: 1fr;
            grid-template-rows: 100%;
        }

        canvas {
            width: 100%;
            height: 100%;
            aspect-ratio: unset;
        }

        canvas:focus {
            outline: none;
        }
    </style>
    <script type="module" src="./block-game/index.ts"></script>
</body>
</html>
