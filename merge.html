<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Merge</title>
</head>

<body>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            background: #14181f;
            overflow: hidden;
        }

        body {
            display: grid;
            height: 100dvh;
            grid-template-columns: 1fr;
            grid-template-rows: 100%;
        }

        canvas {
            width: 100%;
            height: 100%;
            aspect-ratio: unset;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        canvas:focus {
            outline: none;
        }

    </style>
    <script type="module" src="./merge-game/index.ts"></script>
</body>

</html>
